[build]
  command = "npm run build"
  publish = ".next"
  environment = { NODE_VERSION = "18" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Netlify Next.js plugin will handle functions/edge and routing.
# Make sure you set the required environment variables in the Netlify UI:
# - DATABASE_URL (Postgres connection string) OR configure Prisma Data Proxy
# - UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN (if using Upstash limits)
# - NEXT_PUBLIC_... env vars as needed by your app
